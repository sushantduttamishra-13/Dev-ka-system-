<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV KA SYSTEM AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8ff;
  color: #17233b;
}

header {
  height: 65px;
  padding: 15px 20px;
  background: white;
  border-bottom: 1px solid #e3eaf5;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: #2878e8;
}

.newchat {
  background: #e8f1ff;
  color: #2878e8;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 25px 15px 120px;
}

.welcome {
  text-align: center;
  margin: 65px 0 35px;
}

.welcome h1 {
  font-size: 35px;
  background: linear-gradient(90deg,#2878e8,#75baff);
  color: transparent;
  background-clip: text;
}

.welcome p { color: #71809b; }

#chat {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  padding: 14px 17px;
  border-radius: 18px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #2878e8;
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 5px;
}

.bot {
  background: white;
  border: 1px solid #e4ecf8;
  align-self: flex-start;
  border-bottom-left-radius: 5px;
}

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 15px;
  background: #f4f8ff;
}

.input-box {
  max-width: 800px;
  margin: auto;
  display: flex;
  background: white;
  border: 1px solid #dce7f8;
  border-radius: 28px;
  padding: 7px;
  box-shadow: 0 4px 20px #dce7f8;
}

input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 12px;
  font-size: 16px;
  background: transparent;
}

#send {
  border: none;
  background: #2878e8;
  color: white;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  font-size: 20px;
  cursor: pointer;
}

#send:disabled { opacity: .5; }

footer {
  text-align: center;
  color: #8491a8;
  font-size: 11px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ DEV KA SYSTEM</div>
  <button class="newchat" onclick="newChat()">＋ New Chat</button>
</header>

<main>
  <section class="welcome" id="welcome">
    <h1>Hello, Welcome! ✨</h1>
    <p>I'm DEV KA SYSTEM. How can I help you today?</p>
  </section>

  <div id="chat"></div>
</main>

<div class="input-area">
  <div class="input-box">
    <input id="prompt" placeholder="Ask anything..." autocomplete="off">
    <button id="send" onclick="sendMessage()">➤</button>
  </div>
  <footer>DEV KA SYSTEM AI · Powered by Gemini</footer>
</div>

<script>
const API_URL = "https://quiet-cloud-1905.devduttamishra104.workers.dev";

const input = document.getElementById("prompt");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message || sendButton.disabled) return;

  welcome.style.display = "none";
  addMessage(message, "user");
  input.value = "";

  sendButton.disabled = true;
  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "Thinking...";
  chat.appendChild(loading);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message })
    });

    if (!response.ok) throw new Error("Server error: " + response.status);

    const data = await response.json();
    loading.textContent = data.reply || "No reply received.";
  } catch (error) {
    loading.textContent = "Sorry! Connection error. Please try again.";
  }

  sendButton.disabled = false;
  input.focus();
}

function newChat() {
  chat.innerHTML = "";
  welcome.style.display = "block";
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
